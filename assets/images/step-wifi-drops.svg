<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Step 2: when Wi-Fi stays disconnected for 5 seconds the Mac asks the phone for its hotspot; once nothing has been connected for 5 minutes, Android turns it off again</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff17b"/></marker></defs>
<rect width="600" height="220" rx="24" fill="#12081a"/>
<path d="M40 140 V72 a8 8 0 0 1 8 -8 H152 a8 8 0 0 1 8 8 V140 Z" fill="#281336" stroke="#fff17b" stroke-width="2.5" stroke-linejoin="round"/><path d="M90 64 h20 v4 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 z" fill="#fff17b"/><path d="M38.75 140 H161.25 L175 147 V149 Q175 151.5 172.5 151.5 H27.5 Q25 151.5 25 149 V147 Z" fill="#fff17b"/><g transform="translate(100 102)"><path d="M-5.94 2.06 A8.4 8.4 0 0 1 5.94 2.06 L0 8 Z" fill="#fff17b"/><path d="M-12.67 -4.67 A17.92 17.92 0 0 1 12.67 -4.67 L8.71 -0.71 A12.32 12.32 0 0 0 -8.71 -0.71 Z" fill="#fff17b"/><path d="M-19.80 -11.80 A28 28 0 0 1 19.80 -11.80 L15.44 -7.44 A21.84 21.84 0 0 0 -15.44 -7.44 Z" fill="#fff17b"/><path d="M-24 -22 L24 12" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/></g>
<text x="100" y="188" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="0.8">Wi-Fi disconnected</text>
<circle cx="246" cy="102" r="26" fill="none" stroke="#fff17b" stroke-width="2.5"/><path d="M246 84 V102 L258 110" fill="none" stroke="#fff17b" stroke-width="2.5" stroke-linecap="round"/>
<text x="246" y="150" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="1">wait 5 s</text>
<text x="246" y="168" text-anchor="middle" fill="#fff17b" font-size="11" font-weight="400" opacity="0.7">for a known network</text>
<path d="M290 102 H436" stroke="#fff17b" stroke-width="2" marker-end="url(#arrow)"/><text x="363" y="92" text-anchor="middle" fill="#fff17b" font-size="14" font-weight="600" opacity="1">enable</text>
<rect x="456" y="46" width="64" height="112" rx="12" fill="#281336" stroke="#fff17b" stroke-width="2.5"/><circle cx="488" cy="58" r="4" fill="#fff17b"/>
<text x="488" y="184" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="0.8">Phone</text>
<text x="363" y="202" text-anchor="middle" fill="#51d136" font-size="12" font-weight="400" opacity="1">unused for 5 min → Android turns it off</text>
</svg>
