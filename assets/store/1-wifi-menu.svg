<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The Mac's Wi-Fi menu lists the Android phone's hotspot, My Pixel Phone, under Personal Hotspot.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#281336"/><stop offset="1" stop-color="#12081a"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#210f2e"/><stop offset="1" stop-color="#110718"/></linearGradient><linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5066"/><stop offset="1" stop-color="#3a3344"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient><filter id="trough" x="-10%" y="-20%" width="120%" height="140%"><feComponentTransfer in="SourceAlpha" result="hole"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feOffset in="hole" dx="6" dy="6" result="o1"/><feGaussianBlur in="o1" stdDeviation="4" result="b1"/><feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="b1" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="dark"/><feOffset in="hole" dx="-2" dy="-2" result="o2"/><feGaussianBlur in="o2" stdDeviation="1.5" result="b2"/><feFlood flood-color="#413948"/><feComposite in2="b2" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="light"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge></filter><filter id="lift" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<text x="540" y="240" text-anchor="middle" fill="#fff17b" font-size="66" font-weight="600" opacity="1" font-family="'Sorts Mill Goudy', 'Palatino', Georgia, serif">Your Android hotspot,</text>
<text x="540" y="322" text-anchor="middle" fill="#fff17b" font-size="66" font-weight="600" opacity="1" font-family="'Sorts Mill Goudy', 'Palatino', Georgia, serif">right in your Mac's Wi-Fi menu.</text>
<text x="540" y="432" text-anchor="middle" fill="#fff17b" font-size="33" font-weight="400" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">It shows up as a Personal Hotspot, just like an iPhone's.</text>
<g transform="translate(0 500)">
<defs><linearGradient id="wallpaper" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58be0"/><stop offset=".45" stop-color="#8a4fc4"/><stop offset="1" stop-color="#3b2380"/></linearGradient><pattern id="ripples" width="160" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><path d="M-80 40 Q-40 10 0 40 T80 40 T160 40 T240 40" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="10"/></pattern><clipPath id="screen"><rect x="-260" y="0" width="1300" height="2000" rx="34"/></clipPath><clipPath id="bar"><rect x="-260" y="0" width="1300" height="64"/></clipPath><filter id="frost" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect x="-282" y="0" width="1344" height="2044" rx="56" fill="#0b0b0c"/><rect x="-280.5" y="1.5" width="1341" height="2041" rx="55" fill="none" stroke="#5a5a60" stroke-width="3"/>
<g transform="translate(0 22)"><g clip-path="url(#screen)"><rect x="-260" y="0" width="1300" height="2000" fill="url(#wallpaper)"/><rect x="-260" y="0" width="1300" height="2000" fill="url(#ripples)"/>
<g clip-path="url(#bar)"><g filter="url(#frost)"><rect x="-260" y="-40" width="1300" height="144" fill="url(#wallpaper)"/><rect x="-260" y="-40" width="1300" height="144" fill="url(#ripples)"/></g><rect x="-260" y="0" width="1300" height="64" fill="#000" fill-opacity=".22"/></g>
<text x="1010" y="44" text-anchor="end" fill="#f2f2f2" font-size="28" font-weight="400" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">Thu Oct 8  9:41 AM</text>

<rect x="712" y="18" width="28" height="13" rx="6.5" fill="none" stroke="#f2f2f2" stroke-width="2.4"/><circle cx="733" cy="24.5" r="4.2" fill="#f2f2f2"/><rect x="712" y="35" width="28" height="13" rx="6.5" fill="none" stroke="#f2f2f2" stroke-width="2.4"/><circle cx="719" cy="41.5" r="4.2" fill="#f2f2f2"/>
<g fill="none" stroke="#f2f2f2" stroke-width="2.4" transform="translate(654 33) scale(1.25)"><clipPath id="link5"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M-9 0.5 h6 v6 h-6 Z"/></clipPath><clipPath id="link6"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M3 -6.5 h6 v6 h-6 Z"/></clipPath><rect x="-17" y="-9.5" width="23" height="13" rx="6.5" clip-path="url(#link5)"/><rect x="-6" y="-3.5" width="23" height="13" rx="6.5" clip-path="url(#link6)"/></g>
<rect x="534" y="21" width="56" height="24" rx="7" fill="none" stroke="#f2f2f2" stroke-width="2.4"/><rect x="538" y="25" width="48" height="16" rx="4" fill="#f2f2f2"/><path d="M593 29 a4 4 0 0 1 0 8" fill="#f2f2f2"/>
<g transform="translate(168 70)" filter="url(#shadow)"><rect x="0" y="0" width="612" height="348" rx="30" fill="#1c1c1e" fill-opacity=".97" stroke="#4a4a4c" stroke-width="1.5"/><text x="28" y="50" text-anchor="start" fill="#f2f2f2" font-size="27" font-weight="600" opacity="1">Wi-Fi</text>
<rect x="478" y="16" width="108" height="48" rx="24" fill="#9b59b6"/><rect x="518" y="20" width="64" height="40" rx="20" fill="#f4e8f6"/><line x1="26" y1="83" x2="586" y2="83" stroke="#333333" stroke-width="1.5"/><text x="28" y="126" text-anchor="start" fill="#8e8e8e" font-size="23" font-weight="600" opacity="1">Personal Hotspot</text>
<circle cx="52" cy="171" r="26" fill="#9b59b6"/><g fill="none" stroke="#ffffff" stroke-width="3.41463" transform="translate(52 171) scale(0.82)"><clipPath id="link7"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M-10.2683 -0.768293 h8.53659 v8.53659 h-8.53659 Z"/></clipPath><clipPath id="link8"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M1.73171 -7.76829 h8.53659 v8.53659 h-8.53659 Z"/></clipPath><rect x="-17" y="-9.5" width="23" height="13" rx="6.5" clip-path="url(#link7)"/><rect x="-6" y="-3.5" width="23" height="13" rx="6.5" clip-path="url(#link8)"/></g><text x="94" y="181" text-anchor="start" fill="#f2f2f2" font-size="26" font-weight="500" opacity="1">My Pixel Phone</text>
<line x1="26" y1="213" x2="586" y2="213" stroke="#333333" stroke-width="1.5"/><text x="28" y="256" text-anchor="start" fill="#8e8e8e" font-size="23" font-weight="600" opacity="1">Other Networks</text>
<path d="M574 238 l9 10 l-9 10" fill="none" stroke="#8e8e8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="26" y1="279" x2="586" y2="279" stroke="#333333" stroke-width="1.5"/><text x="28" y="322" text-anchor="start" fill="#f2f2f2" font-size="25" font-weight="400" opacity="1">Wi-Fi Settings…</text>
</g></g></g>
</g>
</svg>
