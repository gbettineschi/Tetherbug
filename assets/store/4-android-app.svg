<rect x="700" y="47" width="6" height="5" rx="1.5" fill="#f2f2f2"/><rect x="709" y="42" width="6" height="10" rx="1.5" fill="#f2f2f2"/><rect x="718" y="37" width="6" height="15" rx="1.5" fill="#f2f2f2"/><rect x="727" y="32" width="6" height="20" rx="1.5" fill="#f2f2f2"/><rect x="748" y="37" width="32" height="17" rx="5" fill="none" stroke="#f2f2f2" stroke-width="2"/><rect x="751" y="40" width="22" height="11" rx="2.5" fill="#f2f2f2"/><rect x="782" y="42" width="3" height="7" rx="1.5" fill="#f2f2f2"/><image href="android/1-setup.png" x="260" y="74" width="560" height="1246.23"/></g><circle cx="540" cy="46" r="12" fill="#0b0b0c"/>
