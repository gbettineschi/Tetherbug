<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>When the Mac's Wi-Fi disconnects, the phone's hotspot turns on by itself over Bluetooth and the Mac joins it, like Instant Hotspot with an iPhone.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#281336"/><stop offset="1" stop-color="#12081a"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#210f2e"/><stop offset="1" stop-color="#110718"/></linearGradient><linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5066"/><stop offset="1" stop-color="#3a3344"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient><filter id="trough" x="-10%" y="-20%" width="120%" height="140%"><feComponentTransfer in="SourceAlpha" result="hole"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feOffset in="hole" dx="6" dy="6" result="o1"/><feGaussianBlur in="o1" stdDeviation="4" result="b1"/><feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="b1" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="dark"/><feOffset in="hole" dx="-2" dy="-2" result="o2"/><feGaussianBlur in="o2" stdDeviation="1.5" result="b2"/><feFlood flood-color="#413948"/><feComposite in2="b2" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="light"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge></filter><filter id="lift" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<text x="540" y="322" text-anchor="middle" fill="#fff17b" font-size="66" font-weight="600" opacity="1" font-family="'Sorts Mill Goudy', 'Palatino', Georgia, serif">No Wi-Fi?</text>
<text x="540" y="432" text-anchor="middle" fill="#fff17b" font-size="33" font-weight="400" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">No need to reach for your phone.</text>
<g transform="translate(0 500)">
<path d="M700 250 V80 a20 20 0 0 1 20 -20 H980 a20 20 0 0 1 20 20 V250 Z" fill="#281336" stroke="#fff17b" stroke-width="6" stroke-linejoin="round"/><path d="M825 60 h50 v10 a7.5 7.5 0 0 1 -7.5 7.5 h-35 a7.5 7.5 0 0 1 -7.5 -7.5 z" fill="#fff17b"/><path d="M697 250 H1003 L1037.38 267.5 V272.5 Q1037.38 278.75 1031.12 278.75 H668.875 Q662.625 278.75 662.625 272.5 V267.5 Z" fill="#fff17b"/><g transform="translate(850 155)"><path d="M-11.88 18.12 A16.8 16.8 0 0 1 11.88 18.12 L0 30 Z" fill="#fff17b"/><path d="M-25.34 4.66 A35.84 35.84 0 0 1 25.34 4.66 L17.42 12.58 A24.64 24.64 0 0 0 -17.42 12.58 Z" fill="#fff17b"/><path d="M-39.60 -9.60 A56 56 0 0 1 39.60 -9.60 L30.89 -0.89 A43.68 43.68 0 0 0 -30.89 -0.89 Z" fill="#fff17b"/><path d="M-46 -40 L46 48" stroke="#ff6b6b" stroke-width="9" stroke-linecap="round"/></g>
<circle cx="96" cy="138" r="26" fill="#51d136"/><text x="96" y="149" text-anchor="middle" fill="#12081a" font-size="30" font-weight="700" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">1</text>
<text x="140" y="150" text-anchor="start" fill="#fff17b" font-size="38" font-weight="600" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">Wi-Fi disconnects</text>
<text x="140" y="194" text-anchor="start" fill="#fff17b" font-size="29" font-weight="400" opacity="0.7" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">and no known network is around</text>
<path d="M850 320 V510" stroke="#fff17b" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".6"/><rect x="775" y="530" width="150" height="262.5" rx="28.125" fill="#281336" stroke="#fff17b" stroke-width="6"/><circle cx="850" cy="558.125" r="9.375" fill="#fff17b"/><g transform="translate(850 661.25)"><g transform="translate(-46 -16) scale(1)"><rect width="92" height="52" rx="26" fill="#4a2a63" filter="url(#trough)"/><g filter="url(#lift)"><circle cx="66" cy="26" r="20" fill="url(#knob)"/><circle cx="66" cy="26" r="18.4" fill="none" stroke="url(#rim)" stroke-width="3.2"/></g></g></g>
<path d="M950 644 A26 26 0 0 1 950 696" fill="none" stroke="#fff17b" stroke-width="6" stroke-linecap="round" opacity="1"/><path d="M950 622 A48 48 0 0 1 950 718" fill="none" stroke="#fff17b" stroke-width="6" stroke-linecap="round" opacity="0.75"/><path d="M950 600 A70 70 0 0 1 950 740" fill="none" stroke="#fff17b" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<circle cx="96" cy="638" r="26" fill="#51d136"/><text x="96" y="649" text-anchor="middle" fill="#12081a" font-size="30" font-weight="700" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">2</text>
<text x="140" y="650" text-anchor="start" fill="#fff17b" font-size="38" font-weight="600" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">Your phone's hotspot</text>
<text x="140" y="694" text-anchor="start" fill="#fff17b" font-size="29" font-weight="400" opacity="0.7" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">turns on by itself, over Bluetooth</text>
<path d="M850 820 V1040" stroke="#fff17b" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".6"/><path d="M700 1250 V1080 a20 20 0 0 1 20 -20 H980 a20 20 0 0 1 20 20 V1250 Z" fill="#281336" stroke="#fff17b" stroke-width="6" stroke-linejoin="round"/><path d="M825 1060 h50 v10 a7.5 7.5 0 0 1 -7.5 7.5 h-35 a7.5 7.5 0 0 1 -7.5 -7.5 z" fill="#fff17b"/><path d="M697 1250 H1003 L1037.38 1267.5 V1272.5 Q1037.38 1278.75 1031.12 1278.75 H668.875 Q662.625 1278.75 662.625 1272.5 V1267.5 Z" fill="#fff17b"/><g transform="translate(850 1155)"><g fill="none" stroke="#fff17b" stroke-width="2.69231" transform="translate(0 4) scale(2.6)"><clipPath id="link9"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M-9.36538 0.134615 h6.73077 v6.73077 h-6.73077 Z"/></clipPath><clipPath id="link10"><path clip-rule="evenodd" d="M-30 -20 H30 V20 H-30 Z M2.63462 -6.86538 h6.73077 v6.73077 h-6.73077 Z"/></clipPath><rect x="-17" y="-9.5" width="23" height="13" rx="6.5" clip-path="url(#link9)"/><rect x="-6" y="-3.5" width="23" height="13" rx="6.5" clip-path="url(#link10)"/></g></g>
<circle cx="96" cy="1138" r="26" fill="#51d136"/><text x="96" y="1149" text-anchor="middle" fill="#12081a" font-size="30" font-weight="700" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">3</text>
<text x="140" y="1150" text-anchor="start" fill="#fff17b" font-size="38" font-weight="600" opacity="1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">Your Mac joins it</text>
<text x="140" y="1194" text-anchor="start" fill="#fff17b" font-size="29" font-weight="400" opacity="0.7" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">as a Personal Hotspot</text>
</g>
</svg>
