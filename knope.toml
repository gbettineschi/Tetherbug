# Releases: each change adds a note with `just change`; pushes to main keep a release PR open
# (.github/workflows/prepare-release.yml), and merging it publishes (.github/workflows/release.yml).

[package]
versioned_files = [{ path = "VERSION", regex = "^(?<version>\\S+)" }]
changelog = "CHANGELOG.md"
assets = "artifacts/*"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

# Play's "What's new" for this version, from the same notes.
[[workflows.steps]]
type = "Command"
command = "python3 .github/scripts/play-changelog.py"

[[workflows.steps]]
type = "Command"
command = "git add fastlane"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this publishes $version to GitHub, Homebrew and Play's internal track.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "xav-ie"
repo = "Tetherbug"
