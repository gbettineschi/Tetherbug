name: Release personal apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [mac-trial]
        default: mac-trial
      tag:
        description: Unpublished Mac trial version (v0.1.12-signing.1)
        required: true
        type: string
      expected_sha:
        description: Exact reviewed source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'gbettineschi/Tetherbug'
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the trial source and version
        id: version
        env:
          TRIAL_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          event=os.environ['GITHUB_EVENT_NAME']
          if event == 'workflow_dispatch':
              if os.environ['EXPECTED_SHA'] != os.environ['GITHUB_SHA']: raise SystemExit('Trial source moved')
              tag=os.environ['TRIAL_TAG']
          else: tag=os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?',tag): raise SystemExit('Invalid version')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('version='+tag[1:]+'\n')
          PY
      - name: Test signing boundaries without production keys
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 macos/scripts/test-sign-candidate.py
          python3 macos/scripts/test-ci-project-signing.py
      - name: Build keyless universal Mac candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release.py --mac-only --version "$VERSION"
          mkdir "$RUNNER_TEMP/mac-candidate"
          cp "build/releases/$VERSION/Tetherbug-v$VERSION.zip" "$RUNNER_TEMP/mac-candidate/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-mac-candidate
          path: ${{ runner.temp }}/mac-candidate/
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 15
    environment: macos-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: unsigned-mac-candidate
          path: candidate
          digest-mismatch: error
      - name: Verify owner-only signing protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/macos-release" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/macos-release/deployment-branch-policies" > "$RUNNER_TEMP/refs.json"
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then args+=(--trial-branch "$GITHUB_REF_NAME"); fi
          python3 scripts/verify-macos-signing-environment.py --repository-json "$RUNNER_TEMP/repository.json" --environment-json "$RUNNER_TEMP/environment.json" --refs-json "$RUNNER_TEMP/refs.json" "${args[@]}"
      - name: Sign without executing the candidate
        env:
          MACOS_SIGNING_PKCS12_BASE64: ${{ secrets.MACOS_SIGNING_PKCS12_BASE64 }}
          MACOS_SIGNING_PKCS12_PASSWORD: ${{ secrets.MACOS_SIGNING_PKCS12_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE_SHA1: ${{ secrets.MACOS_SIGNING_CERTIFICATE_SHA1 }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          mkdir signed
          python3 macos/scripts/ci-project-signing.py "candidate/Tetherbug-v$VERSION.zip" "signed/Tetherbug-v$VERSION.zip" --source-sha "$GITHUB_SHA" > signed/signing.json
      - name: Remove temporary private material
        if: always()
        run: python3 macos/scripts/ci-project-signing.py --cleanup-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-mac
          path: signed/*
          retention-days: 1
          if-no-files-found: error

  android:
    if: github.repository == 'gbettineschi/Tetherbug' && github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release source guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Restore the retained Android signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          key = Path(os.environ['RUNNER_TEMP']) / 'tether-signing.p12'
          if not all(os.environ.get(n) for n in ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEYSTORE_ALIAS']):
              raise SystemExit('The retained Android signing secrets are required.')
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          config = Path(os.environ['RUNNER_TEMP']) / 'tether-signing.json'
          config.write_text(json.dumps({'keystore': str(key), 'password': os.environ['KEYSTORE_PASSWORD'], 'alias': os.environ['KEYSTORE_ALIAS']}))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TETHER_SIGNING_CONFIG={config}\n')
          PY
      - name: Build and verify the retained-key APK
        run: |
          python3 scripts/release.py --android-only
          python3 - <<'PY'
          import os,re,shutil
          from pathlib import Path
          version=re.search(r'^versionName=(.+)$',Path('android/gradle.properties').read_text(),re.M).group(1)
          source=Path('build/releases')/version
          target=Path(os.environ['RUNNER_TEMP'])/'verified-android';target.mkdir()
          for name in ['tetherbug-v'+version+'.apk','release.json','SHA256SUMS.txt']:
              shutil.copyfile(source/name,target/name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-android
          path: ${{ runner.temp }}/verified-android/
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/tether-signing.json" "$RUNNER_TEMP/tether-signing.p12"
  publish:
    needs: [android, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: verified-android
          path: raw
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: signed-mac
          path: signed
      - name: Publish exact verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-signed.py raw signed
  tap:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: tetherbug-personal
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
