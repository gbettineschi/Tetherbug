name: Release personal apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'gbettineschi/Tetherbug'
    runs-on: macos-15
    timeout-minutes: 45
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release source guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Restore the retained Android signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          key = Path(os.environ['RUNNER_TEMP']) / 'tether-signing.p12'
          if not all(os.environ.get(n) for n in ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEYSTORE_ALIAS']):
              raise SystemExit('The retained Android signing secrets are required.')
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          config = Path(os.environ['RUNNER_TEMP']) / 'tether-signing.json'
          config.write_text(json.dumps({'keystore': str(key), 'password': os.environ['KEYSTORE_PASSWORD'], 'alias': os.environ['KEYSTORE_ALIAS']}))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TETHER_SIGNING_CONFIG={config}\n')
          PY
      - name: Build, sign and verify both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release.py --publish --existing-tag
          else
            python3 scripts/release.py
          fi
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/tether-signing.json" "$RUNNER_TEMP/tether-signing.p12"
  tap:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: tetherbug-personal
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
